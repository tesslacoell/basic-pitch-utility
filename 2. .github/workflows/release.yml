# Release builds — compiled apps for macOS and Windows.
#
# How a release happens:
#   1. Draft a release in the GitHub web UI with a new tag (e.g. v1.0.0-beta.1)
#      and publish it — pushing the tag triggers this workflow.
#   2. The macOS and Windows jobs below build the apps and attach the
#      installers to that release automatically.
#   (Or run the workflow manually from the Actions tab — builds are then
#   saved as workflow artifacts instead of release assets.)
#
# The apps are UNSIGNED and not notarized (no paid Apple Developer or
# Windows code-signing certificate). First-launch steps for users are in
# MAC-README.md (attached to every release) and the release notes:
# macOS users approve the app once in Privacy & Security; Windows users
# click "More info -> Run anyway" on the SmartScreen prompt.
#
# The repo is public, so standard GitHub-hosted runners are free.

name: Release builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: macOS (universal — Intel + Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # build/icon.png is generated, not committed — the packaging config
      # points at it, so regenerate it before building.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate app icon
        run: |
          pip install Pillow
          python scripts/make-icon.py

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and package (universal)
        run: |
          npm run build
          npx electron-builder --mac --universal

      - name: Save build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            MAC-README.md
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}

  build-windows:
    name: Windows (installer + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate app icon
        run: |
          pip install Pillow
          python scripts/make-icon.py

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and package (NSIS installer + portable exe)
        run: |
          npm run build
          npx electron-builder --win

      - name: Save build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}

